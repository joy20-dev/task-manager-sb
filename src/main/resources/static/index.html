<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Notification -->
  <div id="notification"></div>

  <!-- Login View -->
  <div id="login-view" class="view active">
    <h1>Login</h1>
    <form id="login-form">
      <div id="inputs">
        <label>
          Username
          <input type="text" id="username" required>
        </label>
        <label>
          Password
          <div class="password-wrapper">
            <input type="password" id="password" required>
            <span class="eye-icon" onclick="togglePassword()">👁️</span>
          </div>
        </label>
      </div>
      <button type="submit" id="login-btn">Login</button>
    </form>
    <p>Don't have an account? <a href="#" onclick="showView('register')">Register</a></p>
  </div>

  <!-- Register View -->
  <div id="register-view" class="view">
    <h1>Register</h1>
    <form id="register-form">
      <div id="inputs">
        <label>
          First Name
          <input type="text" id="firstName" required>
        </label>
        <label>
          Last Name
          <input type="text" id="lastName" required>
        </label>
        <label>
          Username
          <input type="text" id="userName" required>
        </label>
        <label>
          Password
          <input type="password" id="reg-password" required>
        </label>
        <label>
          Confirm Password
          <input type="password" id="confirmPassword" required>
        </label>
      </div>
      <button type="submit" id="register-btn">Register</button>
    </form>
    <p>Already have an account? <a href="#" onclick="showView('login')">Login</a></p>
  </div>

  <!-- Tasks View -->
  <div id="tasks-view" class="view">
    <h1>Tasks</h1>
    <form id="task-form">
      <div id="inputs">
        <input type="text" id="task-title" placeholder="Task Title" required>
        <input type="text" id="task-desc" placeholder="Task Description" required>
        <select id="dropDown">
          <option value="All">All</option>
          <option value="Completed">Completed</option>
          <option value="pending">Pending</option>
        </select>
      </div>
      <button type="button" id="add-task-btn">Add Task</button>
    </form>
    <ul id="task-list"></ul>
    <button onclick="logout()">Logout</button>
  </div>
  <script src ="/js/app.js"></script>
</body>
</html>
